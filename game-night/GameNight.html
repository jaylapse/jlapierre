<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Night Host Board</title>
<style>
@import url("https://fonts.googleapis.com/css?family=Source+Sans+Pro:300italic,600italic,300,600");
:root{--bg:#12161a;--surface:rgba(28,34,39,.92);--surface2:rgba(34,41,47,.92);--surface3:rgba(40,48,55,.92);--border:#3a444c;--text:#ffffff;--muted:#a8b3ba;--faint:#7b858c;--primary:#4ea8de;--radius:16px;--shadow:0 14px 36px rgba(0,0,0,.32)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(to bottom, rgba(15,18,21,.82), rgba(15,18,21,.82)), url('/images/bg.jpg') center/cover no-repeat;background-color:var(--bg);color:var(--text);font:300 16px/1.5 'Source Sans Pro',Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow:auto}
.main{padding:12px}
.brand h1{font-size:24px;line-height:1.05;margin:0 0 8px;cursor:pointer;letter-spacing:.04em}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel,.section{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;width:100%;text-transform:uppercase;font-size:.75rem;letter-spacing:.08em;transition:background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.active{background:var(--primary);border-color:var(--primary);color:#071522}
.nav{display:grid;gap:8px;margin-top:10px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.field input,.field select{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03);color:var(--text)}
.workspace{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
.host-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.host-header h2{margin:0 0 6px;font-size:28px;font-weight:600}
.host-header p{margin:0;color:var(--muted)}
.host-actions{display:flex;gap:8px;flex-wrap:wrap}
.host-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;min-height:32px;padding:0;flex:none}
.stepper span{min-width:1.4em;text-align:center;font-size:18px;font-weight:600}
.mini-card{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}
.mini-card strong{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.board{display:grid;gap:12px}
.round{padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}
.round-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.round h3{margin:0;font-size:20px;font-weight:600}
.round p{margin:0;color:var(--muted)}
.items{display:grid;gap:8px;margin-top:10px}
.item{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface3)}
.item strong{display:block;margin-bottom:3px}
.item small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);font-size:12px}
.side-list{display:grid;gap:8px}
.side-note{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}
.side-note strong{display:block;margin-bottom:4px}
.empty{padding:24px;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}
.avatar-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.avatar{display:grid;place-items:center;gap:6px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface3)}
.avatar .circle{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:26px;background:linear-gradient(135deg,var(--primary),#7fc7cf);color:#071013}
.avatar .label{font-size:14px;color:var(--muted);text-align:center}
.rules{display:grid;gap:8px}
.rule{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface3)}
.controls{margin-top:40px}
#back-to-main-btn{position:fixed;top:14px;left:14px;z-index:1000}
#back-to-main-btn button{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:999px;padding:0.5rem 1rem;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:#fff;cursor:pointer;line-height:1}
#back-to-main-btn button:hover{background:rgba(0,0,0,.8)}
.site-footer{text-align:center;padding:14px;font-size:.6rem;letter-spacing:.2rem;text-transform:uppercase;opacity:.6;color:var(--text)}
@media (max-width:1100px){.wrap,.workspace{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div id="back-to-main-btn">
  <button title="Back to main" onclick="window.location.href='/index.html'">Home</button>
</div>
<div class="wrap">
  <aside class="sidebar">
    <div class="controls">
      <div class="field"><input id="search" type="text" placeholder="Search games" /></div>
      <div class="field"><select id="mechanic"><option value="all">All</option><option value="word">Word</option><option value="survey">Survey</option><option value="number">Number</option><option value="draft">Draft</option></select></div>
    </div>
    <div class="nav" id="gameNav"></div>
  </aside>
  <main class="main">
    <div class="workspace">
      <section class="box section">
        <div class="host-header"><div><h2 id="activeTitle">&nbsp;</h2><p id="activeSummary">&nbsp;</p></div><div class="host-actions"><button class="btn" id="newBoardBtn" type="button">New board</button></div></div>
        <div class="host-meta">
          <div class="mini-card"><strong>Format</strong><span id="formatLabel">Host board</span></div>
          <div class="mini-card"><strong>Board</strong><span id="boardLabel">Board 1</span></div>
          <div class="mini-card" id="playersCard" style="display:none">
            <strong>Players</strong>
            <div class="stepper">
              <button class="btn" id="playersMinus" type="button">−</button>
              <span id="playersCount">2</span>
              <button class="btn" id="playersPlus" type="button">+</button>
            </div>
          </div>
        </div>
        <div id="boardArea" class="board"></div>
      </section>
      <aside class="box panel"><h2 style="margin:0 0 10px">Host notes</h2><div class="side-list" id="hostNotes"></div></aside>
    </div>
  </main>
</div>
<footer class="site-footer">&copy; James Lapierre 2025</footer>
<script src="./js/zero-to-hundred.js"></script>
<script src="./js/i-can-eat-that.js"></script>
<script src="./js/got-it.js"></script>
<script src="./js/headbandz.js"></script>
<script src="./js/age-golf.js"></script>
<script src="./js/chain-game.js"></script>
<script src="./js/fast-money.js"></script>
<script src="./js/majority-rules.js"></script>
<script src="./js/thirteen-words.js"></script>
<script>
(function(){
  var source = window.GAMES_LIBRARY || [];
  var state = {
    activeId: null, boardIndex: {}, lastPoolIndex: {}, sampledItems: {},
    playerCount: 2, currentPlayerIndex: 0,
    headbandzUsedNames: [], headbandzCurrentName: null, headbandzRevealed: false,
    chainAssignments: [], chainRevealed: 1, chainRoundOver: false,
    majorityIndex: 0, majorityRevealed: false,
    ageGolfIndex: 0, ageGolfRevealed: false
  };
  function byId(i){return document.getElementById(i)}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function getGame(id){for(var i=0;i<source.length;i++) if(source[i].id===id) return source[i]; return source[0]}
  function currentGame(){return state.activeId ? getGame(state.activeId) : null}
  // Computes a person's current age from a stored "YYYY-MM-DD" birthdate,
  // so ages stay correct forever instead of being a fixed number that goes
  // stale. Used by Age Golf; other games keep using a fixed "detail" string.
  function ageFromBirthdate(dateStr){
    var parts = dateStr.split('-').map(Number);
    var birth = new Date(parts[0], parts[1] - 1, parts[2]);
    var today = new Date();
    var age = today.getFullYear() - birth.getFullYear();
    var hadBirthdayThisYear = (today.getMonth() > birth.getMonth()) ||
      (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
    if (!hadBirthdayThisYear) age--;
    return age;
  }
  // Fisher-Yates partial shuffle - used to draw N random, non-repeating items from a pool.
  function sampleN(arr, n){
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = copy[i]; copy[i] = copy[j]; copy[j] = t;
    }
    return copy.slice(0, Math.min(n, copy.length));
  }
  // Picks a random pool index, avoiding an immediate repeat of the last one shown.
  function pickPoolIndex(g){
    if (g.pools.length <= 1) return 0;
    var idx = Math.floor(Math.random() * g.pools.length);
    if (idx === state.lastPoolIndex[g.id]) idx = (idx + 1) % g.pools.length;
    state.lastPoolIndex[g.id] = idx;
    return idx;
  }
  function currentPool(g){
    if (state.boardIndex[g.id] === undefined) { state.boardIndex[g.id] = pickPoolIndex(g); state.sampledItems[g.id] = undefined; }
    var pool = g.pools[state.boardIndex[g.id] % g.pools.length];
    // A pool with "draw" set has a bigger item bank than shown at once - sample
    // once per board and cache it, so re-rendering the same board (e.g.
    // stepping through prompts one at a time) doesn't silently reshuffle it.
    if (state.sampledItems[g.id] === undefined) {
      state.sampledItems[g.id] = (pool.draw && pool.draw < pool.items.length) ? sampleN(pool.items, pool.draw) : pool.items;
    }
    return { title: pool.title, subtitle: pool.subtitle, items: state.sampledItems[g.id] };
  }
  function nextBoard(g){ state.boardIndex[g.id] = pickPoolIndex(g); state.sampledItems[g.id] = undefined; }
  function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(function(p){return p[0].toUpperCase()}).join('')}
  function avatarHue(name){var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360; return h}
  function renderNav(){var q=byId('search').value.toLowerCase(), m=byId('mechanic').value, out=[]; for(var i=0;i<source.length;i++){var g=source[i], hay=(g.name+' '+g.summary+' '+g.mechanic).toLowerCase(); if(q&&hay.indexOf(q)===-1) continue; if(m!=='all'&&g.mechanic!==m) continue; out.push('<button class="btn'+(g.id===state.activeId?' active':'')+'" type="button" data-load="'+esc(g.id)+'">'+esc(g.name)+'</button>')} byId('gameNav').innerHTML=out.join('')}

  // ---- Turn state shared by any game with usesPlayers:true (Headbandz,
  // Chain Game). Resets whenever a game loads or the player count changes;
  // the count itself carries over between games. ----
  function resetTurnState(){
    state.currentPlayerIndex = 0;
    state.headbandzUsedNames = [];
    state.headbandzCurrentName = null;
    state.headbandzRevealed = false;
    state.chainAssignments = [];
    state.chainRevealed = 1;
    state.chainRoundOver = false;
    state.majorityIndex = 0;
    state.majorityRevealed = false;
    state.ageGolfIndex = 0;
    state.ageGolfRevealed = false;
  }
  function setPlayerCount(n){
    n = Math.max(2, Math.min(10, n));
    if (n === state.playerCount) return;
    state.playerCount = n;
    resetTurnState();
    renderBoard();
  }

  // ---- Headbandz: one name per turn, drawn from the current category and
  // never repeated within a round unless the category runs out. ----
  function drawHeadbandzName(pool){
    var used = state.headbandzUsedNames;
    var available = pool.items.filter(function(it){ return used.indexOf(it.name) === -1; });
    if (!available.length) { used.length = 0; available = pool.items.slice(); }
    var pick = available[Math.floor(Math.random() * available.length)];
    used.push(pick.name);
    state.headbandzCurrentName = pick;
  }
  function renderHeadbandz(g, pool){
    if (!state.headbandzCurrentName) drawHeadbandzName(pool);
    var nm = state.headbandzCurrentName;
    var body = state.headbandzRevealed
      ? '<div class="avatar-row" style="grid-template-columns:1fr">'
        + '<div class="avatar"><div class="circle" style="background:linear-gradient(135deg,hsl('+avatarHue(nm.name)+',65%,60%),hsl('+((avatarHue(nm.name)+40)%360)+',70%,50%))">'+esc(initials(nm.name))+'</div>'
        + '<div><strong>'+esc(nm.name)+'</strong></div>'
        + '<div class="label">Everyone else describes this name</div></div></div>'
        + '<div class="host-actions" style="margin-top:12px"><button class="btn" id="headbandzNextBtn" type="button">Got it — Next name</button></div>'
      : '<div class="host-actions" style="margin-top:12px"><button class="btn" id="headbandzRevealBtn" type="button">Tap to reveal name</button></div>';
    return '<section class="round"><div class="round-top"><div><h3>'+esc(pool.title)+'</h3><p>'+esc(pool.subtitle||'')+'</p></div>'
      + '<div class="pill-row"><span class="pill">Headbandz</span></div></div>' + body + '</section>';
  }

  // ---- Chain Game: one full word chain per player, drawn fresh each round.
  // Players go in order, revealing their own chain one link at a time until
  // they miss; the round ends once every player has had a turn. ----
  function ensureChainRound(g){
    if (state.chainAssignments.length === state.playerCount) return;
    var chains = sampleN(g.pools[0].items, state.playerCount).map(function(it){ return it.name.split(' -> '); });
    state.chainAssignments = chains;
    state.currentPlayerIndex = 0;
    state.chainRevealed = 1;
    state.chainRoundOver = false;
  }
  function renderChainGame(g){
    ensureChainRound(g);
    if (state.chainRoundOver) {
      return '<section class="round"><div class="round-top"><div><h3>Round complete</h3>'
        + '<p>Every player has had a turn with their chain.</p></div></div>'
        + '<div class="host-actions"><button class="btn" id="chainNewRoundBtn" type="button">New Round</button></div></section>';
    }
    var chain = state.chainAssignments[state.currentPlayerIndex];
    var revealed = chain.slice(0, state.chainRevealed).join(' → ');
    var atEnd = state.chainRevealed >= chain.length;
    return '<section class="round">'
      + '<div class="round-top"><div><h3>Chain Game</h3><p>Player '+(state.currentPlayerIndex+1)+' of '+state.playerCount+' — link '+state.chainRevealed+' of '+chain.length+'</p></div></div>'
      + '<div class="items"><div class="item"><strong>'+esc(revealed)+(atEnd?'':' → •••')+'</strong></div></div>'
      + '<div class="host-actions">'
      + (atEnd
          ? '<button class="btn" id="chainAdvanceBtn" type="button">Chain complete — Next Player</button>'
          : '<button class="btn" id="chainCorrectBtn" type="button">Correct — Reveal Next</button><button class="btn" id="chainMissBtn" type="button">Miss — Next Player</button>')
      + '</div></section>';
  }
  // ---- Majority Rules: one prompt at a time, answer hidden until tapped. ----
  function renderMajorityRules(g, p){
    if (state.majorityIndex >= p.items.length) state.majorityIndex = 0;
    var it = p.items[state.majorityIndex];
    return '<section class="round">'
      + '<div class="round-top"><div><h3>'+esc(p.title)+'</h3><p>Prompt '+(state.majorityIndex+1)+' of '+p.items.length+'</p></div>'
      + '<div class="pill-row"><span class="pill">'+esc(g.format)+'</span><span class="pill">'+esc(g.mechanic)+'</span></div></div>'
      + '<div class="items"><div class="item"><strong>'+esc(it.name)+'</strong>'
      + (state.majorityRevealed ? '<small>'+esc(it.detail)+'</small>' : '')
      + '</div></div>'
      + '<div class="host-actions" style="margin-top:12px">'
      + (state.majorityRevealed
          ? '<button class="btn" id="majorityNextBtn" type="button">Next prompt</button>'
          : '<button class="btn" id="majorityRevealBtn" type="button">Tap to reveal answer</button>')
      + '</div></section>';
  }
  // ---- Age Golf: one name at a time, age hidden until tapped. ----
  function renderAgeGolf(g, p){
    if (state.ageGolfIndex >= p.items.length) state.ageGolfIndex = 0;
    var it = p.items[state.ageGolfIndex];
    return '<section class="round">'
      + '<div class="round-top"><div><h3>'+esc(p.title)+'</h3><p>Name '+(state.ageGolfIndex+1)+' of '+p.items.length+'</p></div>'
      + '<div class="pill-row"><span class="pill">'+esc(g.format)+'</span><span class="pill">'+esc(g.mechanic)+'</span></div></div>'
      + '<div class="items"><div class="item"><strong>'+esc(it.name)+'</strong>'
      + (state.ageGolfRevealed ? '<small>'+esc(String(ageFromBirthdate(it.birthdate)))+'</small>' : '')
      + '</div></div>'
      + '<div class="host-actions" style="margin-top:12px">'
      + (state.ageGolfRevealed
          ? '<button class="btn" id="ageGolfNextBtn" type="button">Next name</button>'
          : '<button class="btn" id="ageGolfRevealBtn" type="button">Tap to reveal age</button>')
      + '</div></section>';
  }
  function chainAdvancePlayer(){
    state.currentPlayerIndex++;
    if (state.currentPlayerIndex >= state.playerCount) { state.chainRoundOver = true; }
    else { state.chainRevealed = 1; }
    renderBoard();
  }

  function clearScreen(){state.activeId=null; byId('activeTitle').innerHTML='&nbsp;'; byId('activeSummary').innerHTML='&nbsp;'; byId('formatLabel').textContent='Host board'; byId('boardLabel').textContent='Board 1'; byId('playersCard').style.display='none'; byId('boardArea').innerHTML='<div class="empty"></div>'; byId('hostNotes').innerHTML=''; renderNav()}
  function renderBoard(){
    var g=currentGame();
    if(!g){clearScreen(); return}
    byId('activeTitle').textContent=g.name; byId('activeSummary').textContent=g.summary; byId('formatLabel').textContent=g.format;
    byId('playersCard').style.display = g.usesPlayers ? '' : 'none';
    byId('playersCount').textContent = state.playerCount;
    var content='';
    if(g.id==='headbandz'){
      var pool = currentPool(g);
      byId('boardLabel').textContent = pool.title;
      content = renderHeadbandz(g, pool);
    } else if(g.id==='chain-game'){
      byId('boardLabel').textContent = 'Round in progress';
      content = renderChainGame(g);
    } else if(g.id==='majority-rules'){
      var mp = currentPool(g);
      byId('boardLabel').textContent = mp.title;
      content = renderMajorityRules(g, mp);
    } else if(g.id==='age-golf'){
      var ap = currentPool(g);
      byId('boardLabel').textContent = ap.title;
      content = renderAgeGolf(g, ap);
    } else {
      var p=currentPool(g), items=[];
      byId('boardLabel').textContent=p.title;
      for(var i=0;i<p.items.length;i++){var it=p.items[i]; var detailText=it.birthdate?String(ageFromBirthdate(it.birthdate)):it.detail; items.push('<div class="item"><strong>'+esc(it.name)+'</strong>'+(detailText?'<small>'+esc(detailText)+'</small>':'')+'</div>')}
      if(g.id==='zero-to-hundred' || g.id==='i-can-eat-that' || g.id==='got-it'){
        content='<section class="round"><div class="round-top"><div><h3>'+esc(p.title)+'</h3><p>'+esc(p.subtitle||'')+'</p></div><div class="pill-row"><span class="pill">'+esc(g.format)+'</span><span class="pill">'+esc(g.mechanic)+'</span></div></div><div class="rules">'+items.map(function(x){return x.replace('item','rule')}).join('')+'</div></section>';
      } else {
        content='<section class="round"><div class="round-top"><div><h3>'+esc(p.title)+'</h3><p>'+esc(p.subtitle||'')+'</p></div><div class="pill-row"><span class="pill">'+esc(g.format)+'</span><span class="pill">'+esc(g.mechanic)+'</span></div></div><div class="items">'+items.join('')+'</div></section>';
      }
    }
    byId('boardArea').innerHTML=content; byId('hostNotes').innerHTML=g.notes.map(function(n){return '<div class="side-note"><strong>'+esc(g.name)+'</strong><span>'+esc(n)+'</span></div>'}).join(''); renderNav();
  }
  function loadGame(id){ state.activeId=id; resetTurnState(); renderBoard(); }
  document.addEventListener('click', function(e){
    var el=e.target;
    while(el&&el!==document){
      var load=el.getAttribute&&el.getAttribute('data-load');
      if(load){ loadGame(load); return }
      if(el.id==='headbandzRevealBtn'){ state.headbandzRevealed=true; renderBoard(); return }
      if(el.id==='headbandzNextBtn'){ state.headbandzCurrentName=null; state.headbandzRevealed=false; renderBoard(); return }
      if(el.id==='chainCorrectBtn'){ state.chainRevealed++; renderBoard(); return }
      if(el.id==='chainMissBtn' || el.id==='chainAdvanceBtn'){ chainAdvancePlayer(); return }
      if(el.id==='chainNewRoundBtn'){ state.chainAssignments=[]; renderBoard(); return }
      if(el.id==='majorityRevealBtn'){ state.majorityRevealed=true; renderBoard(); return }
      if(el.id==='majorityNextBtn'){ state.majorityIndex++; state.majorityRevealed=false; renderBoard(); return }
      if(el.id==='ageGolfRevealBtn'){ state.ageGolfRevealed=true; renderBoard(); return }
      if(el.id==='ageGolfNextBtn'){ state.ageGolfIndex++; state.ageGolfRevealed=false; renderBoard(); return }
      if(el.id==='playersMinus'){ setPlayerCount(state.playerCount-1); return }
      if(el.id==='playersPlus'){ setPlayerCount(state.playerCount+1); return }
      el=el.parentNode;
    }
  });
  byId('newBoardBtn').onclick=function(){ var g=currentGame(); if(!g) return; resetTurnState(); nextBoard(g); renderBoard(); };
  byId('search').oninput=renderNav; byId('mechanic').onchange=renderNav;
  renderNav(); clearScreen();
})();
</script>
</body>
</html>
