<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YarnToss</title>
<style>
@import url("https://fonts.googleapis.com/css?family=Source+Sans+Pro:300italic,600italic,300,600");
:root{--bg:#12161a;--surface:rgba(28,34,39,.92);--border:#3a444c;--text:#ffffff;--muted:#a8b3ba;--primary:#4ea8de;--radius:16px;--shadow:0 14px 36px rgba(0,0,0,.32)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(to bottom, rgba(15,18,21,.82), rgba(15,18,21,.82)), url('/images/bg.jpg') center/cover no-repeat;background-color:var(--bg);color:var(--text);font:300 16px/1.5 'Source Sans Pro',Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px 40px}
h1{font-size:26px;font-weight:600;margin:8px 0 4px;letter-spacing:.02em}
p.lede{color:var(--muted);margin:0 0 24px;text-align:center;max-width:480px}
.stage{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 28px;border:1px solid var(--primary);border-radius:999px;background:var(--primary);color:#0c1620;cursor:pointer;text-transform:uppercase;font-size:.85rem;font-weight:600;letter-spacing:.08em;transition:filter .2s;text-decoration:none}
.btn-primary:hover{filter:brightness(1.1)}
#back-to-main-btn{position:fixed;top:14px;left:14px;z-index:1000}
#back-to-main-btn button{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:999px;padding:0.5rem 1rem;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:#fff;cursor:pointer;line-height:1}
#back-to-main-btn button:hover{background:rgba(0,0,0,.8)}
.site-footer{text-align:center;padding:22px 14px 4px;font-size:.6rem;letter-spacing:.2rem;text-transform:uppercase;opacity:.6;color:var(--text)}
</style>
</head>
<body>
<div id="back-to-main-btn">
  <button title="Back to main" onclick="window.location.href='/index.html'">Home</button>
</div>

<h1>YarnToss</h1>
<p class="lede">A cat-survivor game where a stationary granny fights waves of cats. Currently in development - play the latest build on itch.io.</p>

<div class="stage">
  <a class="btn-primary" href="https://jaylapse.itch.io/yarntoss" target="_blank" rel="noopener">Play on itch.io</a>
</div>

<footer class="site-footer">&copy; James Lapierre 2025</footer>
</body>
</html>
