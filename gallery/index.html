<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Galleries</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <style>
    .admin-bar { display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; margin-bottom:1rem; }
    .admin-bar.hidden { display:none; }
    #galleryEditorBtn { position:fixed; bottom:6px; right:6px; z-index:9999; opacity:0.5; }
    .thumb-wrap { position:relative; }
    .thumb-delete {
      position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.65); color:#fff;
      border:none; border-radius:50%; width:1.5rem; height:1.5rem; cursor:pointer; font-size:1rem; line-height:1;
    }
    .video-badge {
      position:absolute; bottom:4px; left:4px; font-size:1.1em; color:#fff;
      background:rgba(0,0,0,0.55); border-radius:50%; padding:1px 6px; pointer-events:none;
    }
    #uploadStatus { text-align:center; font-size:0.9rem; color:#bbb; margin:0.4rem 0; white-space:pre-line; }
    .gallery-switch.active { outline:2px solid #4ea8de; }

    /* main.css sets #wrapper to space-between/min-height:100vh for the homepage's
       header+main+footer layout; this page has too few elements for that, which
       stretches large gaps between them. Stack from the top instead. */
    #wrapper { justify-content: flex-start; min-height: 0; }

    /* Lightbox */
    .lightbox {
      position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:10000;
      display:flex; align-items:center; justify-content:center;
    }
    .lightbox.hidden { display:none; }
    .lightbox-close {
      position:absolute; top:14px; right:20px; background:none; border:none; color:#fff;
      font-size:2.2rem; line-height:1; cursor:pointer; z-index:10002;
    }
    .lightbox-content { max-width:92vw; max-height:88vh; text-align:center; }
    .lightbox-content img,
    .lightbox-content video {
      max-width:92vw; max-height:82vh; width:auto; height:auto;
      border-radius:10px; box-shadow:0 4px 24px rgba(0,0,0,0.5); display:block; margin:0 auto;
    }
    .lightbox-counter { color:#ccc; font-size:0.85rem; margin-top:0.5rem; }
    .lightbox-nav {
      position:absolute; top:50%; transform:translateY(-50%); cursor:pointer; user-select:none;
      color:#fff; font-weight:bold; font-size:2rem; padding:0.5rem 0.9rem; z-index:10001;
      background:rgba(0,0,0,0.35); border-radius:4px;
    }
    .lightbox-prev { left:8px; }
    .lightbox-next { right:8px; }
    @media (max-width: 700px) {
      .lightbox-nav { font-size:1.4rem; padding:0.4rem 0.6rem; }
    }
  </style>
</head>

<body class="gallery-page">
<div id="bg"></div>
<div id="wrapper">
  <h1 style="text-align: center">Galleries</h1>

  <div id="back-to-main-btn" style="position:fixed;top:18px;right:24px;z-index:1000;scale: 0.6;">
    <button style="background:none;border:none;font-size:1.5rem;color:#fff;cursor:pointer;line-height:1;" title="Back to main" onclick="window.location.href='/index.html#galleries'">&times;</button>
  </div>

  <div id="gallery-buttons" style="display:flex;gap:0.7rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap;"></div>

  <div class="admin-bar hidden" id="adminBar">
    <button class="button small" id="newGalleryBtn"><i class="fa-solid fa-plus"></i> New Gallery</button>
    <button class="button small" id="uploadPhotosBtn" style="display:none;"><i class="fa-solid fa-upload"></i> Upload Photos/Videos</button>
    <input type="file" id="photoInput" accept="image/*,video/*" multiple style="display:none;">
  </div>
  <div id="uploadStatus"></div>

  <div class="container">
    <div class="row" id="photo-grid"></div>
  </div>

  <!-- Lightbox popup -->
  <div class="lightbox hidden" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" title="Close">&times;</button>
    <a class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</a>
    <a class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</a>
    <div class="lightbox-content">
      <div id="lightboxMedia"></div>
      <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>
  </div>

  <button class="button" id="galleryEditorBtn">Editor</button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ---- Fill these in after creating a free Cloudinary account (see setup notes) ----
    const CLOUDINARY_CLOUD_NAME = 'yvn0wmms';
    const CLOUDINARY_UPLOAD_PRESET = 'jlapierre';

    const firebaseConfig = {
      apiKey: "AIzaSyCrXvaiwHdc5whQHuhk6SR7EutV_MY7HWE",
      authDomain: "jlapierre-9ed45.firebaseapp.com",
      projectId: "jlapierre-9ed45",
      storageBucket: "jlapierre-9ed45.firebasestorage.app",
      messagingSenderId: "747343028064",
      appId: "1:747343028064:web:2ef67506c81c09103ac805",
      measurementId: "G-EFMF6L65H5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isAdmin = false;
    let galleries = [];
    let currentGalleryId = null;
    let currentImages = [];
    let lightboxIndex = 0;

    const galleryButtonsEl = document.getElementById('gallery-buttons');
    const photoGrid = document.getElementById('photo-grid');
    const adminBar = document.getElementById('adminBar');
    const newGalleryBtn = document.getElementById('newGalleryBtn');
    const uploadPhotosBtn = document.getElementById('uploadPhotosBtn');
    const photoInput = document.getElementById('photoInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const editorBtn = document.getElementById('galleryEditorBtn');
    const lightboxEl = document.getElementById('lightbox');
    const lightboxMedia = document.getElementById('lightboxMedia');
    const lightboxCounter = document.getElementById('lightboxCounter');

    function slugify(label) {
      return label.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'gallery';
    }

    // Cloudinary generates resized/optimized versions on the fly by inserting
    // transformation params into the URL - no separate thumbnail file needed.
    function cloudinaryUrl(url, transform) {
      return url.replace('/upload/', `/upload/${transform}/`);
    }

    function thumbUrlFor(item) {
      if (item.resourceType === 'video') {
        // Cloudinary can derive a JPG poster frame from a video by swapping the extension.
        return cloudinaryUrl(item.url, 'w_300,h_300,c_fill,q_auto').replace(/\.[a-zA-Z0-9]+$/, '.jpg');
      }
      return cloudinaryUrl(item.url, 'w_300,h_300,c_fill,q_auto,f_auto');
    }

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      // "auto" detects image vs video automatically so one upload flow handles both.
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error('Cloudinary upload failed: ' + err);
      }
      return res.json();
    }

    // ---- Admin login (same Firebase Auth account used for the itinerary editor) ----
    editorBtn.addEventListener('click', function() {
      if (isAdmin) {
        firebase.auth().signOut();
      } else {
        const email = prompt('Admin email:');
        if (!email) return;
        const pw = prompt('Admin password:');
        if (!pw) return;
        firebase.auth().signInWithEmailAndPassword(email, pw)
          .catch(function(err) { alert('Login failed: ' + err.message); });
      }
    });
    firebase.auth().onAuthStateChanged(function(user) {
      isAdmin = !!user;
      editorBtn.textContent = isAdmin ? 'Logout' : 'Editor';
      adminBar.classList.toggle('hidden', !isAdmin);
      uploadPhotosBtn.style.display = (isAdmin && currentGalleryId) ? 'inline-flex' : 'none';
      renderGrid();
    });

    // ---- Galleries list ----
    async function loadGalleries() {
      const snap = await db.collection('galleries').orderBy('createdAt').get();
      galleries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGalleryButtons();
      if (galleries.length && !currentGalleryId) {
        loadGallery(galleries[0].id);
      }
    }

    function renderGalleryButtons() {
      galleryButtonsEl.innerHTML = '';
      galleries.forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'gallery-switch small' + (g.id === currentGalleryId ? ' active' : '');
        btn.textContent = g.label;
        btn.onclick = function() { loadGallery(g.id); };
        galleryButtonsEl.appendChild(btn);
      });
    }

    newGalleryBtn.addEventListener('click', async function() {
      const label = prompt('New gallery name:');
      if (!label) return;
      await db.collection('galleries').add({
        label: label,
        slug: slugify(label),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await loadGalleries();
    });

    // ---- Photos/videos within the selected gallery ----
    async function loadGallery(galleryId) {
      currentGalleryId = galleryId;
      renderGalleryButtons();
      uploadPhotosBtn.style.display = isAdmin ? 'inline-flex' : 'none';
      const snap = await db.collection('galleries').doc(galleryId).collection('images').orderBy('createdAt').get();
      currentImages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGrid();
    }

    function renderGrid() {
      if (!currentImages.length) {
        photoGrid.innerHTML = `<p style="text-align:center;color:#999;width:100%;">No photos yet${isAdmin ? ' — click "Upload Photos/Videos" to add some.' : '.'}</p>`;
        return;
      }
      photoGrid.innerHTML = currentImages.map((item, i) => `
        <div class='column thumb-wrap'>
          <img class='demo cursor' src='${thumbUrlFor(item)}' onclick='openLightbox(${i})'>
          ${item.resourceType === 'video' ? `<span class='video-badge'><i class="fa-solid fa-play"></i></span>` : ''}
          ${isAdmin ? `<button class='thumb-delete' title='Delete' onclick='deletePhoto("${item.id}")'>&times;</button>` : ''}
        </div>
      `).join('');
    }

    window.deletePhoto = async function(imageId) {
      if (!confirm('Remove this from the gallery?')) return;
      await db.collection('galleries').doc(currentGalleryId).collection('images').doc(imageId).delete();
      await loadGallery(currentGalleryId);
    };

    uploadPhotosBtn.addEventListener('click', function() {
      if (!currentGalleryId) { alert('Select or create a gallery first.'); return; }
      photoInput.click();
    });

    photoInput.addEventListener('change', async function() {
      const files = Array.from(photoInput.files);
      if (!files.length) return;
      uploadPhotosBtn.disabled = true;
      for (let i = 0; i < files.length; i++) {
        uploadStatus.textContent = `Uploading ${i + 1} of ${files.length}...`;
        try {
          const result = await uploadToCloudinary(files[i]);
          await db.collection('galleries').doc(currentGalleryId).collection('images').add({
            url: result.secure_url,
            publicId: result.public_id,
            resourceType: result.resource_type,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (err) {
          console.error(err);
          alert('Upload failed for ' + files[i].name + ': ' + err.message);
        }
      }
      uploadStatus.textContent = '';
      uploadPhotosBtn.disabled = false;
      photoInput.value = '';
      await loadGallery(currentGalleryId);
    });

    // ---- Lightbox popup ----
    window.openLightbox = function(i) {
      lightboxIndex = i;
      renderLightbox();
      lightboxEl.classList.remove('hidden');
    };
    function renderLightbox() {
      const item = currentImages[lightboxIndex];
      if (!item) return;
      if (item.resourceType === 'video') {
        lightboxMedia.innerHTML = `<video src='${cloudinaryUrl(item.url, 'q_auto')}' controls autoplay playsinline></video>`;
      } else {
        lightboxMedia.innerHTML = `<img src='${cloudinaryUrl(item.url, 'q_auto,f_auto')}'>`;
      }
      lightboxCounter.textContent = `${lightboxIndex + 1} / ${currentImages.length}`;
    }
    function closeLightbox() {
      lightboxEl.classList.add('hidden');
      lightboxMedia.innerHTML = ''; // stop any playing video
    }
    function lightboxNav(n) {
      lightboxIndex = (lightboxIndex + n + currentImages.length) % currentImages.length;
      renderLightbox();
    }
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', function() { lightboxNav(-1); });
    document.getElementById('lightboxNext').addEventListener('click', function() { lightboxNav(1); });
    lightboxEl.addEventListener('click', function(e) {
      if (e.target === lightboxEl) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (lightboxEl.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    loadGalleries();
  </script>

</div>

<!-- Footer -->
<footer id="footer">
  <p class="copyright">&copy; James Lapierre 2025</p>
</footer>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
